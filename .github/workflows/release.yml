name: Release

# Manual release path: push a `vX.Y.Z` tag yourself (see README's
# "Versioning & releases"). The normal path is auto-version.yml, which
# bumps and tags on every push to main and calls the same build --
# this stays around for cutting a release from a tag by hand (e.g.
# re-releasing an old commit, or a version bump that isn't a plain patch).

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    uses: ./.github/workflows/_release-build.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: write
